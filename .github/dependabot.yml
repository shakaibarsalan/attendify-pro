# Weekly, grouped dependency updates, so updates arrive as a few PRs instead of
# one per package. Security fixes are grouped too.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/server"
      - "/apps/web"
      - "/apps/landing"
      - "/apps/org-landing"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The AI service pins its ML stack (numpy, onnxruntime, OpenCV) on purpose, so
  # Python gets security fixes only: a limit of 0 turns routine version bumps off.
  - package-ecosystem: pip
    directory: "/ai-service"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
