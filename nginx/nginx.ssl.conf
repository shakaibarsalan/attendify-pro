events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker internal DNS — re-resolve upstream hostnames every 10 s
    # so stale container IPs after docker compose up don't cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Unified HTTP Entry (port 80) ──────────────────────────────
    # Cloudflare Tunnel → port 80. Route everything correctly:
    #   /api/*, /socket.io/*, /api-docs → backend via web container
    #   SPA routes (/login, /dashboard, etc.) → web container
    #   / (root only) → landing page
    server {
        listen 80;

        # Root URL → landing page
        location = / {
            set $landing_upstream http://landing:80;
            proxy_pass $landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /favicon.svg {
            set $landing_upstream http://landing:80;
            proxy_pass $landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API and WebSocket routes → backend through web container
        location /api/ {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            client_max_body_size 50m;
        }

        location /socket.io/ {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /api-docs {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Everything else → web SPA (login, dashboard, /assets/, etc.)
        # Web container nginx has try_files with @landing fallback for assets
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            client_max_body_size 50m;
        }
    }

    # ── Web Dashboard (port 443, HTTPS) ───────────────────────────
    # SSL is terminated here; web container receives plain HTTP internally.
    # X-Forwarded-Proto: https is passed so the app knows it's secure.
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        # All requests proxied to web container (handles /api/, /socket.io/, SPA)
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            client_max_body_size 50m;
        }
    }
}
