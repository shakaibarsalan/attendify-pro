# org.attendify.pro — serves the organizations/workplace landing page and proxies
# /api to the shared backend (so the chatbot and the Get-Started form work here too).
# This is the org-landing CONTAINER's nginx; the main site's nginx is untouched.
server {
    listen 80;
    server_name _;

    # Docker internal DNS so a redeployed backend's new IP doesn't cause stale 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API (chat assistant + Get-Started/demo lead form) → shared backend, same as
    # the web container does. $backend as a variable forces per-request re-resolve.
    location /api/ {
        set $backend http://server:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Static landing (single-page). Unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
